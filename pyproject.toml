[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedigree-panel-scaling"
version = "0.1.0"
description = "Exact pedigree inference and basic panel-testing policies for 10–15 genes and people."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.4"]

[project.scripts]
pedigree-panel-scaling = "pedigree_panel_scaling.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
